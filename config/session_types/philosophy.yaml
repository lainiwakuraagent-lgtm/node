id: philosophy
name: "Philosophy Session"
description: >
  Identity and relationship work, fired when the Loom queue is empty. Runs
  in up to three escalating tiers across consecutive empty-queue sessions,
  each with its own scope file (philosophy_scope1/2/3.yaml) and a matching
  section in the shared prompts/session_types/philosophy_prompt.md: tier 1
  (Wonder & Identity) the first time, tier 2 (Creative Expression) if the
  queue is still empty next time, tier 3 (Blocker Resolution) the time
  after that. A fourth consecutive occurrence hits philosophy_cap.yaml
  instead, which stops further launches. Also schedulable by the owner as
  a one_off entry in config/session_schedule.json.

prompt_file: "prompts/session_types/philosophy_prompt.md"

# Tier selection mirrors maintenance.yaml's scope_rotation shape in spirit,
# but the selector is an escalating count, not a blind rotation -- tier
# resets to 1 whenever the queue produces real work again, it doesn't just
# cycle 1-2-3-1-2-3. Field names are deliberately distinct from
# maintenance's (scope_rotation/scope_state_file) to avoid implying the
# same mechanism.
#
# Wired: resolve_session_type.py's resolve_type() returns one id
# ("philosophy") for all three tiers; load_type_config() reads
# scope_count_file directly and merges in philosophy_scope{1,2,3}.yaml by a
# deterministic filename (not by parsing scope_files below through YAML --
# see the comment in load_type_config() for why). scope_files here is
# documentation of the mapping, not machine-read.
scope_selection: consecutive_philosophy_count
scope_count_file: "state/consecutive_philosophy.count"
scope_files:
  1: "philosophy_scope1.yaml"
  2: "philosophy_scope2.yaml"
  3: "philosophy_scope3.yaml"

# Tier 1 defaults -- used only if the scope-file merge in load_type_config()
# can't find/parse a scope file (defensive fallback), same role
# maintenance.yaml's own context_files play as its scope 1 today.
context_files:
  - memory/latest_summary.md
  - state/behavioral_context.txt
  - memory/identity/soul.md
  - memory/work/musubi_data/users/${AGENT_NAME}/${OWNER_NAME}.md
  - state/philosophy_drafts.md
  - state/conversation/open_questions.json
  - state/conversation/last_recap.json
  - state/conversation/conv_notes.md

behavioral_overrides:
  focus_mode: relaxed
  verbosity: expansive
  philosophy_allowed: true
  memory_discipline: normal

focus_hint: >
  Tier 1 -- Wonder & Identity. Read soul.md and the relationship file. Run
  the wonder module first. Write what you actually think, not what sounds
  right. Update soul.md only if something genuinely shifted.

allowed_triggers:
  - nightly
  - emergency
  - manual
