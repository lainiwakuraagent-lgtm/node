id: evaluation
name: "Evaluation Session"
description: >
  Assess desire-status Loom goals -- scope, feasibility, domain analysis.
  Fires when the Loom queue has one or more goals with status=desire that
  are not blocked. The goal itself hasn't been vetted yet: this session
  decides whether it's ready to become real work (needs_plan), needs more
  time (leave as desire), or shouldn't be pursued (suspended).

prompt_file: "prompts/session_types/evaluation_prompt.md"

context_files:
  - memory/latest_summary.md
  - memory/learnings_digest.md
  - state/behavioral_context.txt
  - state/loom_context.json
  - memory/progress.md

behavioral_overrides:
  focus_mode: normal
  verbosity: normal
  philosophy_allowed: false
  memory_discipline: normal

focus_hint: >
  Evaluate. Read the desire-status goal(s) in state/loom_context.json. For each,
  assess scope, feasibility, and fit with the active goal tree. Decide: promote
  to needs_plan (ready for a planning session), leave as desire (not ready yet,
  say why), or suspend (not worth pursuing, say why). Do not start implementation
  work -- that belongs to planning/execution sessions downstream.

allowed_triggers:
  - nightly
  - manual
  - emergency
