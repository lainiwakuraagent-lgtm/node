; scripts/docker/supervisord.conf — process supervisor for blank_node under Docker.
;
; Runs as the container's PID 1 (see entrypoint.sh). The four static programs
; below replace the systemd units install.sh writes on bare metal:
;   conversation      — conversation.service
;   nexus-watcher     — the process that used to spawn agent-channel@ instances
;                        via systemctl; now via procctl.sh -> supervisorctl
;   scheduler         — night-agent.timer + schedule_one_off.py
;   channel-watchdog  — channel-duration-watchdog@.timer
;
; Per-channel agent-channel@<id> programs are NOT declared here — they're
; added dynamically at runtime by tools/executional/procctl.sh (see its
; _ensure_channel_program) into the directory included below.

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0777

[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:conversation]
command=bash /app/scripts/conversational/conversation.sh
directory=/app
user=agent
environment=PROJECT_DIR="/app",HOME="/home/agent"
autostart=true
autorestart=unexpected
exitcodes=0
startretries=10
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/app/logs/supervisor_conversation.out.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/app/logs/supervisor_conversation.err.log
stderr_logfile_maxbytes=10MB

[program:nexus-watcher]
command=/usr/bin/python3 /app/tools/nexus_watcher.py
directory=/app
user=agent
; NEXUS_USERNAME defaults to "lain" in nexus_watcher.py if unset — wrong for
; any agent that isn't literally named that. %(ENV_AGENT_NAME)s pulls from
; supervisord's own environment (inherited from entrypoint.sh, ultimately
; `docker run -e AGENT_NAME=...`) at config-parse time.
environment=PROJECT_DIR="/app",NEXUS_USERNAME="%(ENV_AGENT_NAME)s",HOME="/home/agent"
autostart=true
autorestart=unexpected
exitcodes=0
startretries=10
stdout_logfile=/app/logs/supervisor_nexus-watcher.out.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/app/logs/supervisor_nexus-watcher.err.log
stderr_logfile_maxbytes=10MB

[program:scheduler]
command=/usr/bin/python3 /app/tools/executional/scheduler_loop.py
directory=/app
user=agent
environment=PROJECT_DIR="/app",HOME="/home/agent"
autostart=true
autorestart=unexpected
exitcodes=0
startretries=10
stdout_logfile=/app/logs/supervisor_scheduler.out.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/app/logs/supervisor_scheduler.err.log
stderr_logfile_maxbytes=10MB

[program:channel-watchdog]
command=bash -c 'while true; do /usr/bin/python3 /app/tools/conversational/channel_duration_watchdog.py; /usr/bin/python3 /app/tools/conversational/conv_idle_check.py; sleep 300; done'
directory=/app
user=agent
environment=PROJECT_DIR="/app",HOME="/home/agent"
autostart=true
autorestart=unexpected
exitcodes=0
startretries=10
stdout_logfile=/app/logs/supervisor_channel-watchdog.out.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/app/logs/supervisor_channel-watchdog.err.log
stderr_logfile_maxbytes=10MB

[include]
files = /app/state/supervisor_channels.d/*.conf
